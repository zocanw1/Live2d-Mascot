<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live2D Mascot Overlay</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #canvas {
        display: block;
      }
      #voice-bubble {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        max-width: 460px;
        width: max-content;
        display: none;
        background: rgba(20, 20, 24, 0.92);
        color: #f5f5f7;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        padding: 12px 16px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        z-index: 1000000;
        pointer-events: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        white-space: pre-wrap;
        word-wrap: break-word;
      }
    </style>
    <!-- Cubism Core Runtimes -->
    <script src="./live2d.min.js"></script>
    <script src="./live2dcubismcore.min.js"></script>
    <script>
      if (window.Live2DCubismCore && !window.Live2DCubismCore.Memory) {
        window.Live2DCubismCore.Memory = {
          initializeAmountOfMemory: function() {}
        };
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
    </div>
    <div id="voice-bubble"><span id="voice-bubble-text"></span></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
