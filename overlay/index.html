<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live2D Mascot Overlay</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #canvas {
        display: block;
      }
    </style>
    <!-- Cubism Core Runtimes -->
    <script src="./live2d.min.js"></script>
    <script src="./live2dcubismcore.min.js"></script>
    <script>
      if (window.Live2DCubismCore && !window.Live2DCubismCore.Memory) {
        window.Live2DCubismCore.Memory = {
          initializeAmountOfMemory: function() {}
        };
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
